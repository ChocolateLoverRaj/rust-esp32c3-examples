[package]
name = "xbox_controller"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "no_std_hello_world"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
defmt = "1.0.1"
embassy-executor = "0.9.1"
embassy-futures = { version = "0.1.2" }
embassy-time = { version = "0.5.0" }
esp-alloc = "0.9.0"
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", version = "0.18.1", features = [
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", version = "0.4.0" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", version = "1.0.0", features = [
    "unstable",
] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", version = "0.16.1", features = [
    "defmt-espflash",
] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", version = "0.17.0", features = [
    "ble",
    "unstable",
] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", version = "0.2.0", features = [
    "embassy",
    "esp-radio",
] }
trouble-host = { version = "0.6", features = ["defmt", "security"] }

[features]
default = ["esp32c3"]
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-radio/esp32c3",
    "esp-alloc/esp32c3",
]
